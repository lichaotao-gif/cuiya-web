<script type="module" src="/assets/js/main.js?v=20260922-3"></script>
<script type="module">
  import { fetchList } from '/assets/js/data/api.js';
  import { initReveal, renderPager, escapeHtml } from '/assets/js/lib/ui.js';

  const LIMIT = 12;
  const grid = document.getElementById('newsGrid');
  const pager = document.getElementById('newsPager');

  const cardOf = (n, i) => `
    <a class="ncard" href="/news-detail.html?id=${encodeURIComponent(n.id)}" data-reveal data-reveal-delay="${(i % 6) * 60}">
      <div class="ncard__media">${
        n.cover ? `<img src="${encodeURI(n.cover)}" alt="" width="640" height="360" loading="lazy" decoding="async">` : ''
      }</div>
      <div class="ncard__body">
        <span class="ncard__date num">${n.date}</span>
        <h3 class="ncard__title">${escapeHtml(n.title)}</h3>
        <p class="ncard__sub">${escapeHtml(n.subtitle)}</p>
        <span class="ncard__foot btn btn--text">阅读全文 <span class="arw">→</span></span>
      </div>
    </a>`;

  async function load(page) {
    const url = new URL(location.href);
    url.searchParams.set('page', page);
    history.replaceState(null, '', url);

    grid.innerHTML = Array.from({ length: 6 }, () => '<div class="skeleton skeleton--card"></div>').join('');

    try {
      const { count, list } = await fetchList('news', { page, limit: LIMIT });
      if (!list.length) {
        grid.innerHTML = `<div class="state" style="grid-column:1/-1"><h3>暂无内容</h3><p>该页没有可展示的报道。</p></div>`;
        return;
      }
      grid.innerHTML = list.map(cardOf).join('');
      initReveal();
      renderPager(pager, {
        page,
        pages: Math.ceil(count / LIMIT),
        total: count,
        onGo: (p) => {
          load(p);
          document.getElementById('main').scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
      });
    } catch (err) {
      grid.innerHTML = `<div class="state" style="grid-column:1/-1"><h3>加载失败</h3><p>${escapeHtml(
        err.message
      )}，请稍后重试。</p></div>`;
      pager.innerHTML = '';
    }
  }

  const start = Math.max(1, Number(new URL(location.href).searchParams.get('page')) || 1);
  load(start);
</script>
</body>
