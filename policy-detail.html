<body>
<div id="site-nav"></div>

<main id="main" class="shell">
  <section class="section">
    <div class="wrap">
      <nav class="crumb" aria-label="面包屑" style="margin-bottom:var(--sp-4)">
        <a href="/">首页</a><i>/</i><a href="/policy.html">政策文件</a><i>/</i><span>正文</span>
      </nav>

      <article class="article" id="article">
        <div class="skeleton skeleton--row" style="height:44px;margin-bottom:16px"></div>
        <div class="skeleton skeleton--row" style="height:20px;width:40%;margin-bottom:32px"></div>
        <div class="skeleton skeleton--row" style="height:280px"></div>
      </article>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="/assets/js/main.js?v=20260922-7"></script>
<script type="module">
  import { fetchOne, fetchList, orgOf } from '/assets/js/data/api.js';
  import { escapeHtml, sanitizeHtml, formatDate } from '/assets/js/lib/ui.js';

  const root = document.getElementById('article');
  const id = new URL(location.href).searchParams.get('id');

  if (!id) {
    root.innerHTML = `<div class="state"><h3>缺少文件编号</h3><p>请从<a class="btn btn--text" href="/policy.html">政策文件列表</a>进入。</p></div>`;
  } else {
    render();
  }

  async function render() {
    try {
      const item = await fetchOne('policy', id);
      if (!item) {
        root.innerHTML = `<div class="state"><h3>未找到这份文件</h3><p><a class="btn btn--text" href="/policy.html">返回列表</a></p></div>`;
        return;
      }

      document.title = `${item.title} - 四川萃雅教育科技有限公司`;
      root.innerHTML = `
        <div class="row row--wrap" style="gap:10px;margin-bottom:var(--sp-2)">
          <span class="tag tag--cyan">${escapeHtml(orgOf(item.title))}</span>
          ${item.date ? `<span class="num" style="color:var(--text-3);font-size:.85rem">${formatDate(item.date)}</span>` : ''}
        </div>
        <h1 class="article__title">${escapeHtml(item.title)}</h1>
        ${item.subtitle ? `<p class="lede" style="margin-bottom:var(--sp-3)">${escapeHtml(item.subtitle)}</p>` : ''}
        <div class="article__body">${sanitizeHtml(item.content)}</div>
        ${
          item.url
            ? `<p style="margin-top:var(--sp-4)"><a class="btn btn--ghost" href="${encodeURI(item.url)}" target="_blank" rel="noopener noreferrer">查看原文 <span class="arw">→</span></a></p>`
            : ''
        }
        <nav class="article__nav" id="artNav" aria-label="上下篇"></nav>`;

      buildNav(item.id);
    } catch (err) {
      root.innerHTML = `<div class="state"><h3>加载失败</h3><p>${escapeHtml(err.message)}，请稍后重试。</p></div>`;
    }
  }

  async function buildNav(currentId) {
    const nav = document.getElementById('artNav');
    if (!nav) return;
    try {
      const { list } = await fetchList('policy', { page: 1, limit: 50 });
      const i = list.findIndex((x) => String(x.id) === String(currentId));
      if (i < 0) return;
      const prev = list[i - 1];
      const next = list[i + 1];
      nav.innerHTML = [
        prev
          ? `<a href="/policy-detail.html?id=${encodeURIComponent(prev.id)}"><span>← 上一篇</span><b>${escapeHtml(prev.title)}</b></a>`
          : `<span></span>`,
        next
          ? `<a href="/policy-detail.html?id=${encodeURIComponent(next.id)}" style="text-align:right"><span>下一篇 →</span><b>${escapeHtml(next.title)}</b></a>`
          : `<span></span>`,
      ].join('');
    } catch {
      nav.remove();
    }
  }
</script>
</body>
</html>
