<script type="module">
  import { DOWNLOAD_GROUPS, OS_ICON, detectOS } from '/assets/js/data/downloads.js';
  import { initReveal, escapeHtml } from '/assets/js/lib/ui.js';

  const os = detectOS();
  const OS_NAME = { mac: 'macOS', win: 'Windows', android: 'Android', ios: 'iOS' };

  const hint = document.getElementById('osHint');
  hint.textContent = os
    ? `检测到你正在使用 ${OS_NAME[os]}，已为你高亮对应版本。`
    : '请根据你的设备选择对应版本。';

  const itemOf = (it) => `
    <a class="dl-item${it.os === os ? ' is-recommended' : ''}" href="${encodeURI(it.url)}"
       target="_blank" rel="noopener noreferrer">
      <span class="dl-item__os" aria-hidden="true">${OS_ICON[it.os] || ''}</span>
      <span class="dl-item__meta">
        <span class="dl-item__name">${escapeHtml(it.label)}</span>
        <span class="dl-item__info">前往下载页</span>
      </span>
      ${it.os === os ? '<span class="dl-item__badge">推荐</span>' : ''}
    </a>`;

  const sectionOf = (s) => `
    ${s.title ? `<h4 class="dl-sub">${escapeHtml(s.title)}</h4>` : ''}
    <div class="row row--wrap" style="gap:var(--sp-3);align-items:flex-start">
      <div class="dl-grid" style="flex:1;min-width:min(260px,100%)">${s.items.map(itemOf).join('')}</div>
      ${
        s.qr
          ? `<figure class="qr">
               <img src="${encodeURI(s.qr.src)}" alt="${escapeHtml(s.qr.label)}" width="96" height="96" loading="lazy" decoding="async">
               <figcaption style="color:var(--text-3);font-size:.76rem;max-width:110px;text-align:center">${escapeHtml(
                 s.qr.label
               )}</figcaption>
             </figure>`
          : ''
      }
    </div>`;

  document.getElementById('dlRoot').innerHTML = DOWNLOAD_GROUPS.map(
    (g, i) => `
      <section class="dl-group" data-reveal data-reveal-delay="${i * 60}">
        <header class="dl-group__head">
          <h3>${escapeHtml(g.name)}</h3>
          <span class="dl-group__scope">适用业务：${escapeHtml(g.scope)}</span>
        </header>
        ${g.sections.map(sectionOf).join('')}
      </section>`
  ).join('');

  initReveal();
</script>
</body>
